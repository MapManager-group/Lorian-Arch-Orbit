name: Build 26.2

on:
  push:
    branches: ["*"]
    paths:
      - "common/**"
      - "fabric/**"
      - "neoforge/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  pull_request:
    branches: ["*"]
    paths:
      - "common/**"
      - "fabric/**"
      - "neoforge/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Build Fabric and NeoForge jars
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: lorian-arch-orbit-26.2
          if-no-files-found: error
          retention-days: 14
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-dev.jar
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-dev.jar
